<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Garagem Bruta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">Garagem <span>067</span></div>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <section class="configurator">
        <h2>Entre em Contato</h2>
        <div class="controls" style="max-width: 500px; margin: 0 auto; display: flex; flex-direction: column;">
            <form>
                <div class="control-group" style="margin-bottom: 15px;">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome" style="padding: 10px; width: 100%; border-radius: 5px; border: 1px solid #555; background: #333; color: #fff;">
                </div>
                <div class="control-group" style="margin-bottom: 20px;">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="Seu e-mail" style="padding: 10px; width: 100%; border-radius: 5px; border: 1px solid #555; background: #333; color: #fff;">
                </div>
                <button type="button" style="padding: 10px 20px; background-color: var(--primary-color); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Enviar</button>
            </form>
        </div>
    </section>
</body>
</html>
